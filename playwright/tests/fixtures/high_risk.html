<!doctype html>
<html><head><meta charset="utf-8"><title>Apply</title></head>
<body>
<form onsubmit="event.preventDefault(); fetch('/__submitted');">
  <label>Full name * <input name="n" required></label>
  <label>Email * <input type="email" name="e" required></label>
  <fieldset><legend>Have you ever been convicted of a criminal offence? *</legend>
    <label><input type="radio" name="crim" value="y" required>Yes</label>
    <label><input type="radio" name="crim" value="n">No</label>
  </fieldset>
  <label><input type="checkbox" name="cert" required> I certify that the information provided is true *</label>
  <label>Gender (optional) <select name="g"><option value="">--</option><option>Female</option><option>Male</option><option>Prefer not to say</option></select></label>
  <button type="submit" onclick="fetch('/__submitted')">Submit</button>
</form>
</body></html>
