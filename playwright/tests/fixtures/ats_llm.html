<!doctype html>
<html><head><meta charset="utf-8"><title>Apply - unusual wording</title></head>
<body>
<!-- Labels no deterministic rule matches, so only the local Qwen mapper can resolve them. -->
<form onsubmit="event.preventDefault(); fetch('/__submitted');">
  <label>Full name * <input name="n" required></label>
  <label>Anticipated compensation (LPA) * <input name="comp" required></label>
  <label>Place of residence * <input name="res" required></label>
  <label>Name of your present organisation * <input name="org" required></label>
  <label>How soon can you come on board? (days) * <input type="number" name="soon" required></label>
  <label>Why us? * <textarea name="why" required></textarea></label>
  <button type="submit" onclick="fetch('/__submitted')">Submit</button>
</form>
</body></html>
